version: "3.9"

services:
  api:
    build: .
    container_name: graph_rag_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  streamlit:
    build: .
    container_name: graph_rag_ui
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped

  # Fully local, zero-cost LLM backend (PRD 2.1). Not required if you set
  # LLM_PROVIDER=openai or LLM_PROVIDER=groq in .env instead.
  ollama:
    image: ollama/ollama:latest
    container_name: graph_rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
